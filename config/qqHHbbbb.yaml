# Steering file for cutflow.py
# 2025/11/05 - Bryan Bliewert / DESY / bryan.bliewert@desy.de

# Changes:
# 2025/11: following globals are allowed: EventCategories, FinalStateDefinitions
#          following environment variables are assumed: REPO_ROOT, DATA_PATH

# hypothesis: used as label in plots and for naming output files
# made available within the run of cutflow as environment variable '$hypothesis'
hypothesis: qqbbbb

signal_categories:
- EventCategories.qqHHbbbb
- EventCategories.bbHHbbbb

# used to calculate event weights and absolute event counts
# polarization of [ electronBeam, positronBeam ]
beam_polarization: [ -0.8, +0.3 ]

# unit: ab^-1
luminosity: 2.

# set to true for a clean run; i.e. delete previous run through cutflow (plots/tables),
# MVA training files + any plots/tables. can also be set individually per source in the
# sources section below
reset: false

# definition of event categories
# the registration of event categories to specific sources is done in the sources section
# info: while the naming can be arbitrary, a unique ID must be supplied which must exist 
#       in the EVENT_CATEGORIES_TRUE class, too. See EventCategories.py
event_categories: '$REPO_ROOT/config/event_categories.yaml'

# definition of input data and information about the event categorization
# path                : path to a directory containing Merged.root file whose content
#                       must be compliant to the one output from the AnalysisCombine
#                       workflow task. if use_caching=True, the directory must be wri-
#                       table to store the cache files
# event_categorization: items: the categories to register for the respective source
#                       default: optional default category to apply first
#                       order: optional, will use the order used in items if null or
#                              not apply any category beyond the default one if []
#                       
#                       for configuring the items for event_categorization, see
#                         config/event_categories.yaml
# file                : optional, default: Merged.root; ROOT file with EventObservables*,
#                       KinFit*, FinalStates TTrees etc.
sources:
  - name: 4fsl
    path: $DATA_PATH/AnalysisCombine/550-4fsl-$CONF_SUFFIX
    root_files: $DATA_PATH/AnalysisFinal/550-4fsl-$CONF_SUFFIX/*.root
    event_categorization:
      default: EventCategories.F4_OTHER
      order: null
      items: [ vvqq, llqq, lvqq ]
    disabled: false
    reset: false

  - name: 4flh
    path: $DATA_PATH/AnalysisCombine/550-4flh-$CONF_SUFFIX
    root_files: $DATA_PATH/AnalysisFinal/550-4flh-$CONF_SUFFIX/*.root
    event_categorization:
      default: EventCategories.F4_OTHER
      order: null
      items: [ llll, qqqq, vvvv ]
    disabled: false
    reset: false

  - name: 2l4q
    path: $DATA_PATH/AnalysisCombine/550-2l4q-$CONF_SUFFIX
    root_files: $DATA_PATH/AnalysisFinal/550-2l4q-$CONF_SUFFIX/*.root
    event_categorization:
      default: EventCategories.F6_OTHER
      order: null
      #items: [ lvqqqq, lvbbqq, evbbqq, μvbbqq, τvbbqq, lvbbbb, llqqqq, llbbqq, llbbbb, vvqqqq, vvbbqq ]
      items: [ lvqqqq, lvbbqq, lvbbbb, llqqqq, llbbqq, llbbbb, vvqqqq, vvbbqq ]
    disabled: false
    reset: false

  - name: llhh
    path: $DATA_PATH/AnalysisCombine/550-llhh-$CONF_SUFFIX
    root_files: $DATA_PATH/AnalysisFinal/550-llhh-$CONF_SUFFIX/*.root
    event_categorization:
      default: null
      order: null
      items: [ llhh, eeHHbbbb, μμHHbbbb, ττHHbbbb, llhh_llbbbb, llhh_llnonbbbb, llqqh ]
    disabled: true
    reset: false

  # contains both the qqHH (signal) and qqqqH (ZZH background) samples; the categorization
  # uses the process of each event. later items take precedence, i.e. bbHHbbbb (Z->bb)
  # is carved out of qqHHbbbb
  - name: qqhh
    path: $DATA_PATH/AnalysisCombine/550-qqhh-$CONF_SUFFIX
    root_files: $DATA_PATH/AnalysisFinal/550-qqhh-$CONF_SUFFIX/*.root
    event_categorization:
      default: null
      order: null
      items: [ qqHH, qqHHbbbb, bbHHbbbb, qqHH_nonbbbb, qqqqH ]
    disabled: false
    reset: false

  - name: 6q
    path: $DATA_PATH/AnalysisCombine/550-6q-$CONF_SUFFIX
    root_files: $DATA_PATH/AnalysisFinal/550-6q-$CONF_SUFFIX/*.root
    event_categorization:
      default: EventCategories.qqqqqq
      order: []
      items: [ bbqqqq, bbbbqq, bbbbbb ]
    disabled: false
    reset: false

  - name: tthz
    path: $DATA_PATH/AnalysisCombine/550-tthz-$CONF_SUFFIX
    root_files: $DATA_PATH/AnalysisFinal/550-tthz-$CONF_SUFFIX/*.root
    event_categorization:
      default: EventCategories.ttHZ
      order: null
      items: [ ttH, ttZ, ttHZ ]
    disabled: false
    reset: false

# feature definition
# controls how data from ROOT input files of each source should be interpreted and
# converted to columnar format. assumes that branches are in regular shape, i.e.
# have same number of rows (and also columns for 2D branches)
features:

  # interpret a branch of a TTree as either 1D or 2D array, supports 1D+2D branches
  # all properties defined here will be readonly in analysis code
  # Arguments:
  # interpret/name: name of output dataset in HDF5 file. data is accessed using this key
  #                 as hdf5file[name] or dataStore[name] in analysis code. see also names
  # interpret/tree: TTree and name
  # interpret/branch: (optional) branch name; name will be used, if not provided
  # interpret/columns: for 2D arrays: must be an integer, specifying how many columns are
  #                    expected to exist they will be saved as <name>.dim<i> with i=0,..,
  #                    <columns>
  #                    for named arrays: must be a list of strings, specifying the names
  #                    of each column (e.g. fCoordinates.fX, ... for a PxPyPzE vector)
  # interpret/auto_increment: if True, this will be filled with np.arange(nrows, [dtype=
  #                           interpret/dtype, defaults to uint32])
  # interpret/names: list of names; can be used to create multiple entries within the
  #                  interpret section with different name. this enforces branch = name
  # interpret/clamp_min or clamp_max: if defined, values of this branch will be clamped
  #                                   within this range
  # interpret/nan_to: if defined, NaN values will be replaced with this. this is done 
  #                   after clamping (if any)
  interpret:
  - { name: id, dtype: uint32, auto_increment: true }
  - { name: event, tree: FinalStates, dtype: uint32 }
  - { name: cross_section, tree: FinalStates, dtype: float }
  - { name: final_state_counts, tree: FinalStates, branch: final_state_counts.second, columns: 17, dtype: uint8 }
  - { name: n_b_from_higgs, tree: FinalStates, dtype: uint8 }
  - { name: pol_code, tree: FinalStates, branch: polarization_code, dtype: uint8 }
  - { name: process, tree: FinalStates, dtype: uint32 }

  # all following features come from the EventObservablesQQ/KinFitQQ_* TTrees (qqbbbb channel)
  # the number of jets is 6: bmax1..6 are the b-tags (sorted descending) and jet1_m..jet6_m the jet masses
  # (sorted ascending when the DataStore is initialized)

  # event selection
  - { name: errorCode, tree: EventObservablesQQ, branch: errorCode, dtype: uint8 }
  - { names: [ nisoleptons ], tree: EventObservablesQQ, dtype: uint8 }

  # flavor tagging
  - { names: [ bmax1, bmax2, bmax3, bmax4, bmax5, bmax6 ], tree: EventObservablesQQ, dtype: float32 }
  - { names: [ cmax1, cmax2, cmax3, cmax4 ], tree: EventObservablesQQ, dtype: float32 }
  - { names: [ btagz, ctagz, btag4sum, btag4prod ], tree: EventObservablesQQ, dtype: float32 }
  - { name: nbjets05, tree: EventObservablesQQ, dtype: uint8 }
  # note: sumBTags (bmax1+..+bmax4) is derived in the DataStore; sum over all six jets is
  - { name: sumBTags6, tree: EventObservablesQQ, branch: sumBTags, dtype: float32 }

  # jets
  - { names: [ jet1_m, jet2_m, jet3_m, jet4_m, jet5_m, jet6_m ], tree: EventObservablesQQ, dtype: float32 }
  - { names: [ cosjj_max, mjj_min ], tree: EventObservablesQQ, dtype: float32 }
  - { names: [ npfos ], tree: EventObservablesQQ, dtype: uint16 }
  - { names: [ npfosmin6j, npfosmax6j ], tree: EventObservablesQQ, dtype: uint16 }
  - { names: [ yminus, yplus ], tree: EventObservablesQQ, dtype: float32 }

  # global event properties
  - { name: m_inv_jets, tree: EventObservablesQQ, branch: m_invjet, dtype: float32 }
  - { names: [ ptmiss, pzmiss, cosmiss, thrust, costhrust, evis ], tree: EventObservablesQQ, dtype: float32 }
  - { names: [ sphericity, aplanarity, fw2 ], tree: EventObservablesQQ, dtype: float32 }

  # ZHH hypothesis from jet masses only (Z->qq, H->bb from all 45 pairings; chi2 contains Z mass)
  - { names: [ zhh6_chi2, zhh6_mz, zhh6_mh1, zhh6_mh2, zhh6_mhh, zhh6_recoil_hh, zhh6_recoil_z,
               zhh6_cosz, zhh6_coshh, zhh6_cos_hh, zhh6_cos_zjj, zhh6_cosh1star, zhh6_cosh2star ], tree: EventObservablesQQ, dtype: float32 }

  # ZZH hypothesis, WW/ZZ -> 4 jets, ttbar -> 6 jets
  - { names: [ zzh6_chi2, zzh6_mh, zzh6_mz1, zzh6_mz2 ], tree: EventObservablesQQ, dtype: float32 }
  - { names: [ ww4_chi2, ww4_mw1, ww4_mw2, zz_bestchi2 ], tree: EventObservablesQQ, dtype: float32 }
  - { names: [ tt_chi2, tt_mw1, tt_mw2, tt_mt1, tt_mt2 ], tree: EventObservablesQQ, dtype: float32 }

  # kinematic fits; chi2 can reach 1e9 for failed fits
  - { name: ZHH_FitChi2, tree: KinFitQQ_ZHH, branch: FitChi2, dtype: float32, clamp_max: 100000. }
  - { name: ZZH_FitChi2, tree: KinFitQQ_ZZH, branch: FitChi2, dtype: float32, clamp_max: 100000. }
  - { name: ZHH_FitProbability, tree: KinFitQQ_ZHH, branch: FitProbability, dtype: float32 }
  - { name: ZZH_FitProbability, tree: KinFitQQ_ZZH, branch: FitProbability, dtype: float32 }
  - { name: ZHH_p1stBeforeFit, tree: KinFitQQ_ZHH, branch: p1stBeforeFit, dtype: float32 }
  - { name: ZZH_p1stBeforeFit, tree: KinFitQQ_ZZH, branch: p1stBeforeFit, dtype: float32 }
  - { name: ZHH_cosThBeforeFit, tree: KinFitQQ_ZHH, branch: cosThBeforeFit, dtype: float32 }
  - { name: ZZH_cosThBeforeFit, tree: KinFitQQ_ZZH, branch: cosThBeforeFit, dtype: float32 }
  - { names: [ kfzhh_mhh, kfzhh_cosz, kfzhh_cos_hh ], tree: EventObservablesQQ, dtype: float32 }

  # MEM: matrix elements are calculated separately, see AttachMatrixElements below
  #- { names: [
  #      jet1_4v/fCoordinates,
  #      jet2_4v/fCoordinates,
  #      jet3_4v/fCoordinates,
  #      jet4_4v/fCoordinates,
  #      jet5_4v/fCoordinates,
  #      jet6_4v/fCoordinates
  #    ], tree: EventObservablesQQ, dtype: float32, columns: [ fCoordinates.fX, fCoordinates.fY, fCoordinates.fZ, fCoordinates.fT ] }
  #- { name: jet_matching_kinfit_best, tree: EventObservablesQQ, dtype: int8, columns: 6 }

# cutflow_table
# defines the event categories and the order with which they should be appear in the
# cutflow table and also which of them are considered to belong to the signal (these
# are appended to the rightmost part of the table).
# items/category: name of the event category (must be part of EventCategories)
# items/label: column label (supports LaTeX)
# items/is_signal: optional, defaults to false; whether or not this category belongs to
#                  the signal

cutflow_table:
  items:
    - category: qqqqH
      label: qqqqH
    - category: qqqq
      label: qqqq
    - category: lvbbqq
      label: lvbbqq
    - category: bbqqqq
      label: bbqqqq
    - category: bbbbqq
      label: bbbbqq
    - category: qqHH_nonbbbb
      label: qqHH (non-bbbb)
    - category: qqHHbbbb
      label: (qqHH bbbb)
      is_signal: true
    - category: bbHHbbbb
      label: (bbHH bbbb)
      is_signal: true
  ignore_categories: []

# general note about cuts:
# they appear in groups composed of at least one cut and are denoted in code by the
# parameter 'step'
# the first group is preselection (group/step=0). <counter> starts at 0 too
# every stage of MVA will add another group (1,2,3 etc.)
# future TODO: assig an ID to cuts as in cut.<group>.<counter>

# parameters:
# cuts.<group>.quantity: (name in data store/ROOT TTree), operator (see below),
#                             value or lower+upper, label (description to use in plots) 
# cuts.<group>.operator: any of gte (greater than or equal), lte (lower than or
#                             eqal), eq (equal) or within_bounds
# cuts.<group>.{value/lower/upper}: cut parameters
#
# all parameters (except of operator) are passed directly to the respective constructors
# of Less/GreaterThan/Equal/WithinBoundsCut cuts can be disabled by commenting out the
# line or adding disabled: true

cuts:
  preselection:
  - { quantity: nisoleptons, operator: eq, value: 0, label: 'N_{iso. leptons}' }
  - { quantity: ptmiss, operator: lte, value: 100., label: 'p_{t}^{miss}', unit: 'GeV' }
  - { quantity: thrust, operator: lte, value: 0.9, label: 'thrust' }
  - { quantity: zhh6_mz, operator: within_bounds, lower: 40., upper: 120., label: 'm_{Z}', unit: 'GeV', xlim_view: [0, 200] }
  - { quantity: zhh6_mh1, operator: within_bounds, lower: 85., upper: 155., label: 'm_{H1}', unit: 'GeV', xlim_view: [0, 250] }
  - { quantity: zhh6_mh2, operator: within_bounds, lower: 60., upper: 180., label: 'm_{H2}', unit: 'GeV', xlim_view: [0, 250] }
  - { quantity: sumBTags, operator: gte, value: 1., label: 'sum b-tags', disabled: true }
  
  # the mva_cut is applied after training and inference of a MVA
  # the value to cut on can be either
  # 1. entered manually or
  # 2. the best found value can be fetched automatically from a
  #    TrainingAction implementing MVAThresholdFinderInterface
  #    for this, use the syntax: <mva_name>.threshold
  mva_cut:
  - { quantity: SigMVAOutput, operator: gte, value: default_mva.threshold }

  # filled lazily by the OptimizeMVANDimensional action (cut_group); required when more than one
  # signal class is used, where SklearnMulticlassTraining finds one set of thresholds per signal class
  mva_cuts_lazy: None

# MVAs are defined here
# training, inference and optimization (i.e. assignment which threshold value to use) are
# done by actions, which reference the MVA (see the actions section).
# 
#
# parameters:
# mvas.#.name: label/name to reference this MVA in action
# mvas.#.features: list of features (i.e. columns in a DataStore to use)
# mvas.#.classes: list of tuples()
# mvas.#.label_name: column to save the MVA output in
# mvas.#.data_file: file to store input data in
# mvas.#.mva_file: file to save the model to
#
mvas:
  - name: default_mva
    features: [
      jet1_m, jet2_m, jet3_m, jet4_m, jet5_m, jet6_m,
      bmax1, bmax2, bmax3, bmax4, bmax5, bmax6, btag4sum, btag4prod, nbjets05, ctagz,
      m_inv_jets, ptmiss, pzmiss, thrust, costhrust, sphericity, aplanarity, fw2,
      npfos, npfosmin6j, yplus, yminus, cosjj_max, mjj_min,
      zhh6_chi2, zhh6_mz, zhh6_mh1, zhh6_mh2, zhh6_mhh, zhh6_recoil_hh, zhh6_cosz, zhh6_cos_hh, zhh6_cos_zjj,
      zzh6_chi2, zzh6_mh, zzh6_mz1, zzh6_mz2,
      ww4_chi2, zz_bestchi2, tt_chi2, tt_mt1, tt_mt2,
      ZHH_FitChi2, ZZH_FitChi2, ZHH_FitProbability, ZZH_FitProbability,
      ZHH_p1stBeforeFit, ZZH_p1stBeforeFit, ZHH_cosThBeforeFit, ZZH_cosThBeforeFit,
      kfzhh_mhh ]
    classes:
    # two-element arrays of structure (label, name of registered EventCategory)
    # see sources/.../event_categorization/items
    - [0, 'qqHHbbbb']
    - [1, 'bbHHbbbb']
    - [2, 'qqqqH']
    - [3, 'bbqqqq']
    - [4, 'bbbbqq']
    - [5, 'lvbbqq']
    - [6, 'qqqq']
    # note: the output is the sum for all signal categories given in steer['signal_categories'] 
    label_name: SigMVAOutput

    # file to store the training and testing data in for training this classifier
    data_file: $hypothesis_train_test.npz

    mva_file: $hypothesis_mva.pickle

# define what should be done after the data is loaded
# for a documentation of supplied actions, see zhh/analysis/cutflow_processor_actions/README.md
actions:
  - type: ApplyCuts
    cuts: preselection
    weight_column: weight
    split: 0 # split is only read if weight_column is different than the default value 'weight'
    step: 0 # step=0 is always preselection
    cache: '$hypothesis_cutflow_presel.pickle'
  
  # optional:
  # step_start: 0
  # step_end: 0
  - type: CreateCutflowPlots
    file: '$hypothesis_cutflow_preselection_plots.pdf'
    
  # optional:
  # step_start: 0
  # step_end: 0
  - type: CreateCutflowTable
    file: '$hypothesis_cutflow_preselection_table.pdf'

  - type: WriteROOTSnapshot
    file: '$hypothesis_inputs.root'
    include_custom_columns: [event_category, weight]
    include_input_columns: true
    include_mva_outputs: false
    # optional:
    # tree: cutflow

  # split in train/testing [accross all steps, i.e. regardless of cut group]
  # creates a new integer column 'split'; for n entries in fractions:
  # value 0 is assigned to a fraction of events specified as first entry in fractions
  # value 1[..]n-1 to fractions given at position 1 to n-1
  # value n is assigned to the remaining events [fraction (1 - sum(all previous values))]
  - type: SplitDatasets
    fractions: [ 0.5 ]
    # the following two are just here to be explicit and should not be changed
    split_column: split 
    wt_split_column: weights_split
    
  # writes out training/testing data
  # optional:
  # step: 0
  - type: WriteMVAData
    mva: default_mva

  - type: PrintSplitWeights
    disabled: true

  # matrix elements are calculated separately; this action is commented out on purpose
  # data_source: 'kinfit' or (TODO) 'flavortag' or 'hybrid'
  #- type: AttachMatrixElements
  #  output_name: DsigZHH_ZZH
  #  data_source: kinfit

  # training with fixed hyperparameters
  - type: SklearnMulticlassTraining
    hyperparams: {
      max_depth: 5,
      n_estimators: 500,
      learning_rate: 0.02
    }
    debug: true
    mva: default_mva
    split: 0
    disabled: true

  # optional:
  # clf_prop: clf
  # step: 0
  - type: SklearnMulticlassHyperparamTraining
    hyperparam_bounds: [
      { name: max_depth, type: int, lower: 3, upper: 7 },
      { name: n_estimators, type: int, lower: 250, upper: 750 },
      { name: learning_rate, type: float, lower: 0.01, upper: 0.6 }
    ]
    mva: default_mva
    split: 0
    ntrials: 250
    disabled: false

  # optional:
  # clf_prop: clf
  # step: 0
  - type: SklearnMulticlassInference
    mva: default_mva
    split: 1 # split 0 = train dataset; split 1 = test dataset
  
  - type: PlotMVAFeatures
    mva: default_mva
    file: $hypothesis_mva_training_distributions.pdf
    plot_kwargs: {
      bins: 50
    }

  - type: WriteROOTSnapshot
    file: '$hypothesis_mva.root'
    include_custom_columns: [split, weights_split]
    include_input_columns: false
    include_mva_outputs: true

  - type: PlotMVAOutputs
    mva: default_mva
    file: $hypothesis_mva_output_distributions.pdf
    step: 0
    split: 1
    weight_column: weights_split
    signal_categories: [ qqHHbbbb, bbHHbbbb ]
    N_largest: 3
    nbins: 25

  # finds the optimal cut on the MVA outputs (one threshold set per signal category)
  - type: OptimizeMVANDimensional
    mva: default_mva
    cut_group: mva_cuts_lazy
    cut_file: $hypothesis_optimized_mva_cuts.txt
    plot_file: $hypothesis_optimized_mva_cuts.pdf
    step: 0
    step_out: 1 # optimized cuts are stored at step_out
    split: 1
    weight_column: weights_split
    signal_categories: [ qqHHbbbb, bbHHbbbb ]

  - type: ApplyCuts
    cuts: mva_cuts_lazy
    step_in: 0
    step: 1
    split: 1 # use only testing data
    weight_column: weights_split # use the weights after splitting the dataset

  # note: CreateCutflowPlots cannot be used for step >= 1 since the optimized MVA cut is a
  # NDimensionalBinnedCut, which is not supported by the cutflow plots (yet)
  #- type: CreateCutflowPlots
  #  file: '$hypothesis_cutflow_mva_plots.pdf'
  #  step_start: 1
  #  step_end: 1

  - type: CreateCutflowPlots
    file: '$hypothesis_cutflow_mva_plots.pdf'
    step_start: 0
    step_end: 1

  - type: CreateCutflowTable
    file: '$hypothesis_cutflow_mva_table.pdf'
    step_start: 0
    step_end: 1

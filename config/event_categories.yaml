# event categories are used for plotting/cutflow tables and assigned using MC truth information
# each entry is parsed into an EventCategoryDefinition and registered in the GlobalEventCategoryRegistry
# <#>.name and <#>.id are obligatory. the ID's value is arbitrary but must be unique and kept constant,
#   as it is stored in the event_category column of existing datasets
# <#>.final_state (optional): Python code (lambda source, fsc) parsed to a FinalStateDefinition; np and
#   ProcessCategories are available. categories without final_state can be used as default categories
# order of assignment for each event (event_category column):
# 1. (deprecated) the TTree branch event_category is read; the value might be overwritten by 2. and 3. (if defined)
# 2. a default value can be used to overwrite for all events of a data source (see sources section of the steering files)
# 3. the value of the last matching registered category (see event_categorization.items for each source) is used, where
#    the order is given either explicitly (event_categorization.order) or the order of definition is used.
# IDs are taken from the former EVENT_CATEGORY_TRUE (zhh/processes/EventCategories.py)
